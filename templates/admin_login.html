{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Combass Holiday</title>

    <link
        rel="stylesheet"
        href="{% static 'css/admin_login.css' %}"
    >

</head>


<body>


<div class="login-page">


    <div class="login-card">


        <!-- LOGO -->

        <div class="login-logo">

            <div class="login-icon">
                ✈
            </div>

            <h1>
                COMBASS
            </h1>

        </div>


        <!-- TITLE -->

        <div class="login-header">

            <h2>
                Admin Login
            </h2>

            <p>
                Sign in to manage your travel agency
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

            <div class="error-message">

                ⚠️ {{ error }}

            </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="post">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-btn"
            >

                🔐 Login to Dashboard

            </button>

        </form>


        <!-- BACK TO WEBSITE -->

        <a
            href="{% url 'main' %}"
            class="back-home"
        >

            ← Back to Website

        </a>


    </div>


</div>


</body>

</html>
